Name: Texts
Summary: Old version of Paigr. New versions are in Brad White's apps
Description: |
  Texts is now called Paigr, and new versions are published in Brad White's
  apps. Add that repository to keep getting updates. This one stays at Texts
  0.3. https://bradleyw801.github.io/sidephone-apps/

  Texts is where you read and answer the texts Relay sends from the phone
  with your SIM. It works on any Android phone, even one with no Google
  services, and your replies go out from the relay phone's number. You get a
  notification for each conversation as texts come in.

  Install Relay on the phone with your SIM first, then pair Texts with a
  one-time code from it, either by scanning the QR code with this phone's
  camera or typing the code.

