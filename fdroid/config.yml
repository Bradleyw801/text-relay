---
# Text Relay by Brad White: an F-Droid-format repository served from GitHub Pages.
# No secrets live in this file. The index signing key is committed only in encrypted form
# (keystore.p12.enc); the publish workflow decrypts it with the FDROID_KEYSTORE_PASS secret,
# which is also the keystore and key password.

repo_url: https://bradleyw801.github.io/text-relay/repo
repo_name: Text Relay by Brad White
repo_description: >-
  Relay and Texts are now called Paigr Relay and Paigr, and new versions are in
  Brad White's apps at https://bradleyw801.github.io/sidephone-apps/. This repository
  stays up for phones that already have it, but it gets no new builds.
repo_icon: icon.png

# No archive repo: the newest version of each app is what gets served.
archive_older: 0

keystore: keystore.p12
repo_keyalias: textrelay
keystorepass: {env: FDROID_KEYSTORE_PASS}
keypass: {env: FDROID_KEY_PASS}
keydname: CN=Text Relay by Brad White, OU=F-Droid, O=Brad White, C=US

# Everything here is a prebuilt APK, so skip the source checks fdroidserver does for apps it builds.
make_current_version_link: false
update_stats: false
