Name: Relay
Summary: Old version of Paigr Relay. New versions are in Brad White's apps
Description: |
  Relay is now called Paigr Relay, and new versions are published in Brad
  White's apps. Add that repository to keep getting updates. This one stays
  at Relay 0.6. https://bradleyw801.github.io/sidephone-apps/

  Relay goes on the phone that has your SIM and Google Messages. It sends
  every text that phone gets, RCS included, to your Text Relay inbox, where
  Texts on your other phone shows it. Replies go back out through Messages
  from your number.

  It reads Messages' notifications, so it needs notification access, and
  Messages notifications have to stay on (they can be silent). Keep the
  phone on Wi-Fi and plugged in. Pair it with a one-time code from Texts,
  either by scanning the QR code with this phone's camera or typing the
  code.

